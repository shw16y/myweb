<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从佛罗伦萨到萨拉热窝 · 你的选择</title>
<style>
  :root{
    --paper:#fffdf8; --bg:#f4f1ea; --ink:#2b2b2b;
    --brown:#5a3e1b; --gold:#c9a227; --olive:#8a6d3b;
    --line:#e2dccb; --accent:#b5521f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh; padding:26px 14px 70px;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #fbf7ec 0%, transparent 55%),
      radial-gradient(circle at 92% 100%, #f1ebda 0%, transparent 50%),
      var(--bg);
    color:var(--ink); line-height:1.85;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:820px; margin:0 auto;}

  /* ============ 顶部 ============ */
  .top{text-align:center; margin-bottom:22px;}
  .kicker{
    font-size:12px; letter-spacing:3px; color:var(--olive);
    text-transform:uppercase;
  }
  .top h1{
    font-size:27px; color:var(--brown); margin:8px 0 4px;
    letter-spacing:2px; font-weight:700;
  }
  .top h1::after{
    content:''; display:block; width:70px; height:3px; margin:12px auto 0;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .tagline{font-size:13px; color:var(--olive); margin:10px 0 0; letter-spacing:1px;}

  /* ============ 数值条 ============ */
  .hud{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    margin:18px 0 12px;
  }
  .stat{
    display:flex; align-items:center; gap:7px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:6px 16px; font-size:13px;
    box-shadow:0 1px 3px rgba(90,62,27,.06);
    transition:background .3s, border-color .3s;
  }
  .stat .lbl{color:var(--olive);}
  .stat .val{
    font-weight:700; color:var(--brown); font-size:15px;
    min-width:1.3em; text-align:center; font-variant-numeric:tabular-nums;
  }
  .stat.pop{animation:pop .5s ease;}
  @keyframes pop{
    0%{transform:scale(1);}
    35%{transform:scale(1.13); background:#fdf6e0; border-color:var(--gold);}
    100%{transform:scale(1);}
  }

  /* ============ 进度条 ============ */
  .progress{
    height:4px; background:#e8e1cf; border-radius:99px; overflow:hidden;
    margin:0 auto 26px; max-width:420px;
  }
  .progress .bar{
    height:100%; width:10%; border-radius:99px;
    background:linear-gradient(90deg, var(--gold), #e0b83c);
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }

  /* ============ 卡片 ============ */
  .card{
    background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:32px 36px 28px;
    box-shadow:0 8px 28px rgba(90,62,27,.08);
    animation:fadeUp .4s ease both;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }
  .era{
    font-size:12px; letter-spacing:2px; color:var(--olive);
    padding-bottom:6px;
  }
  .card h2{
    font-size:20px; color:var(--brown); margin:4px 0 18px;
    padding-left:13px; border-left:5px solid var(--gold);
    line-height:1.5;
  }
  .body p{margin:11px 0; text-align:justify; font-size:15px;}
  .body b{color:var(--accent); font-weight:700;}
  .body .hl{
    background:#faf4e2; border-left:4px solid var(--gold);
    padding:10px 14px; border-radius:0 8px 8px 0; margin:16px 0;
    color:#6b4a17;
  }

  /* ============ 选项 ============ */
  .actions{margin-top:22px;}
  .choice{
    display:flex; align-items:center; gap:13px;
    width:100%; text-align:left; cursor:pointer;
    background:#fff; border:1px solid #ddd3ba; border-radius:11px;
    padding:14px 17px; margin:11px 0; font-size:15px;
    font-family:inherit; color:inherit; line-height:1.6;
    transition:all .2s ease;
  }
  .choice:hover{
    border-color:var(--gold); background:#fdf9ec;
    transform:translateX(5px);
    box-shadow:0 5px 18px rgba(201,162,39,.16);
  }
  .choice:active{transform:translateX(2px) scale(.995);}
  .idx{
    flex:0 0 27px; height:27px; border-radius:50%;
    background:#f0e9d6; color:var(--brown); font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s;
  }
  .choice:hover .idx{background:var(--gold); color:#fff;}
  .txt{flex:1;}

  .choice.single{
    justify-content:center; background:#fdf9ec; border-color:var(--gold);
    font-weight:700; color:var(--brown);
  }
  .choice.single .txt{flex:0 0 auto; text-align:center; letter-spacing:1px;}

  /* ============ 结局 ============ */
  .card.ending{border-color:var(--gold);}
  .card.ending h2{border-left-color:var(--accent);}
  .final{
    margin:26px 0 20px; padding:18px 20px;
    background:#faf6ec; border:1px dashed #d9cfb4; border-radius:11px;
  }
  .final-title{
    font-size:12px; letter-spacing:3px; color:var(--olive);
    margin-bottom:12px;
  }
  .final-stats{display:flex; gap:12px; flex-wrap:wrap;}
  .final-stats > div{
    flex:1 1 120px; background:#fff; border:1px solid var(--line);
    border-radius:9px; padding:10px 12px;
    display:flex; flex-direction:column; gap:2px;
  }
  .final-stats span{font-size:12px; color:var(--olive);}
  .final-stats b{
    font-size:22px; color:var(--brown); font-variant-numeric:tabular-nums;
  }
  .restart{
    display:block; width:100%; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:700; letter-spacing:1px;
    background:var(--brown); color:#fdf9ec; border:none;
    border-radius:11px; padding:14px; transition:all .2s;
  }
  .restart:hover{background:#7a5522; box-shadow:0 6px 20px rgba(90,62,27,.25);}

  .foot{
    margin-top:30px; text-align:center; font-size:12px;
    color:#a89a80; letter-spacing:1px; line-height:1.9;
  }

  @media (max-width:600px){
    body{padding:18px 10px 50px;}
    .top h1{font-size:21px; letter-spacing:1px;}
    .card{padding:22px 18px 20px; border-radius:11px;}
    .card h2{font-size:17px;}
    .body p{font-size:14.5px;}
    .choice{font-size:14px; padding:12px 13px; gap:10px;}
    .final-stats b{font-size:18px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="kicker">初三世界历史 · 秋假作业 · 互动版</div>
    <h1>从佛罗伦萨到萨拉热窝</h1>
    <p class="tagline">资本主义发展全景图 —— 你的选择，决定城市的命运</p>
  </header>

  <div class="hud">
    <div class="stat" data-key="cap"><span>💰</span><span class="lbl">资本</span><span class="val">2</span></div>
    <div class="stat" data-key="idea"><span>💡</span><span class="lbl">思想</span><span class="val">0</span></div>
    <div class="stat" data-key="inst"><span>🏛️</span><span class="lbl">制度</span><span class="val">0</span></div>
  </div>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <main id="stage"></main>

  <div class="foot">
    深圳市 · 初三世界历史秋假作业　|　史实依据：统编版《世界历史》九上、九下<br>
    游戏只是叙事的壳，真实的历史只有一条路——请回到教材核对每一个史实。
  </div>

</div>

<script>
/* ================= 状态 ================= */
const ICON = { cap:'💰', idea:'💡', inst:'🏛️' };
const state = { cap:2, idea:0, inst:0 };
let currentId = 'c1';
const TOTAL_STEPS = 9;

/* ================= 剧本 ================= */
const scenes = {

  /* ---------- 第一章 ---------- */
  c1: {
    step: 1,
    era: '14 世纪 · 意大利 佛罗伦萨',
    chapter: '第一章',
    title: '资本主义的萌芽',
    body: `
      <p>中世纪的欧洲，土地几乎就是全部财富。但在 14 世纪的佛罗伦萨，事情悄悄变了样。</p>
      <p>乡下，富裕农民租下土地、雇工耕作，把粮食和羊毛卖到市场——这是<b>租地农场</b>。城里，商人把手艺工人集中到一间作坊，分工协作、按件付酬——这是<b>手工工场</b>。</p>
      <p>当"雇工"和"被雇"出现在同一张桌上，资本主义的萌芽就破土了。而你，正是一位佛罗伦萨的工场主。</p>
    `,
    choices: [
      { label:'把利润投回工场：多买羊毛、添几台织机、再雇几个雇工', eff:{cap:2}, next:'c2' },
      { label:'在乡下买座别墅收地租，过个体面的日子', eff:{cap:-1}, next:'c2' }
    ]
  },

  /* ---------- 第二章 ---------- */
  c2: {
    step: 2,
    era: '14—16 世纪 · 佛罗伦萨 → 伦敦',
    chapter: '第二章',
    title: '文艺复兴：以人为中心',
    body: `
      <p>钱包鼓起来之后，佛罗伦萨人开始关心另一件事：人活着，到底为了什么？</p>
      <p>但丁写下《神曲》，达·芬奇的画笔让蒙娜丽莎微笑，莎士比亚在伦敦的剧院里让哈姆雷特发问。他们不再只讲天堂与来世，而是赞美人的力量、人的尊严、人的现世幸福。</p>
      <p>这是<b>思想解放的第一波——文艺复兴</b>，一场"以人为中心"的思想风暴。</p>
    `,
    choices: [
      { label:'出资赞助艺术家与学者，让城市因思想而闪光', eff:{idea:2}, next:'c3' },
      { label:'只买几幅便宜的仿作装点门面，钱得留着生钱', eff:{cap:1}, next:'c3' }
    ]
  },

  /* ---------- 第三章 ---------- */
  c3: {
    step: 3,
    era: '15 世纪末—16 世纪 · 大西洋',
    chapter: '第三章',
    title: '新航路开辟：世界连成整体',
    body: `
      <p>奥斯曼帝国卡住了通往东方的旧商路，欧洲的商人们急着寻找新的航线。</p>
      <p>1487 年迪亚士到达好望角，1492 年哥伦布横渡大西洋，1498 年达·伽马抵达印度，1519—1522 年麦哲伦船队完成环球航行。</p>
      <p>世界，第一次被连成了一个整体。商路变了，贸易中心从地中海挪到了大西洋沿岸。</p>
    `,
    choices: [
      { label:'押上全部身家，投资一支远洋船队', eff:{cap:3}, next:'c4' },
      { label:'守住地中海的老生意，稳妥为上', eff:{cap:1}, next:'c4' }
    ]
  },

  /* ---------- 第四章 ---------- */
  c4: {
    step: 4,
    era: '16—19 世纪 · 大西洋三角',
    chapter: '第四章',
    title: '原始资本积累：三角贸易与殖民掠夺',
    body: `
      <p>新航路打开后，欧洲的商船把目光投向非洲与美洲。</p>
      <p>枪和酒运到非洲换黑奴，黑奴被运到美洲的种植园，美洲的糖、烟草、金银再运回欧洲——这就是<b>三角贸易</b>。与此同时，殖民者在美洲抢掠金银、屠杀原住民，在印度用武力打开市场。</p>
      <p>马克思把这一切称为<b>资本的原始积累</b>：每一枚金币上，都沾着血。</p>
    `,
    choices: [
      { label:'参与三角贸易与殖民地掠夺，迅速暴富', eff:{cap:4}, next:'c5' },
      { label:'做正当的转口贸易，慢一点也无妨', eff:{cap:1, idea:1}, next:'c5' }
    ]
  },

  /* ---------- 抉择 ---------- */
  c5: {
    step: 5,
    era: '18 世纪 · 你的账房',
    chapter: '岔路口',
    title: '这笔财富，往哪儿去？',
    body: `
      <p>几代人的时间过去，你的家族积累了可观的财富：码头、货栈、工场、殖民地种植园的股份。</p>
      <p>此刻，你坐在账房里，面前摆着两条路。</p>
      <p class="hl">这不是一次普通的消费选择——它决定了这座城市未来两百年的命运。</p>
    `,
    choices: [
      { label:'继续积累：把资本投进技术、工场与制度，让它不断增值', next:'c6' },
      { label:'挥霍一空：修宫殿、办舞会、买金餐具，让钱花个痛快', next:'q1' }
    ]
  },

  /* ======= 继续积累线 ======= */
  c6: {
    step: 6,
    era: '17—18 世纪 · 欧洲',
    chapter: '第五章',
    title: '启蒙运动与制度的确立',
    body: `
      <p>钱能买来机器，买不来秩序。</p>
      <p>17—18 世纪，<b>启蒙运动</b>席卷欧洲。伏尔泰为自由呐喊，卢梭写下"主权在民"，孟德斯鸠主张三权分立。理性之光，照亮了革命的道路。</p>
      <p>1640—1689 年，英国资产阶级革命确立<b>君主立宪制</b>；1775—1783 年，美国独立战争发表《独立宣言》；1789 年，法国大革命爆发，拿破仑的《法典》随大军传遍欧洲。<b>资本主义制度，初步确立。</b></p>
    `,
    choices: [
      { label:'出资办报办学，支持启蒙思想家，推动议会与法治改革', eff:{inst:2}, next:'c7' },
      { label:'政治是别人的事，我只盯着账本', eff:{cap:1}, next:'c7' }
    ]
  },

  c7: {
    step: 7,
    era: '1760s—1840s · 英国',
    chapter: '第六章',
    title: '第一次工业革命：蒸汽时代',
    body: `
      <p>棉纺织厂的机器日夜轰鸣。<b>瓦特改良的蒸汽机</b>取代了水力与人力，<b>工厂制度</b>取代了手工工场。火车在铁轨上奔跑，轮船横渡大洋。</p>
      <p>生产力前所未有地飞跃。但机器也带来新的问题：工人每天干十几个小时，童工在矿井里爬行。1848 年，《共产党宣言》发表，<b>马克思主义诞生</b>，工人运动兴起。</p>
    `,
    choices: [
      { label:'把资本砸进蒸汽机、铁路与矿山', eff:{cap:3}, next:'c8' },
      { label:'再观望观望，让老工场多撑几年', eff:{cap:-1}, next:'c8' }
    ]
  },

  c8: {
    step: 8,
    era: '1860s—20 世纪初',
    chapter: '第七章',
    title: '制度向世界扩展',
    body: `

      <p>1870 年代起，<b>电力、内燃机、化学工业</b>掀起第二次工业革命。电灯点亮城市，汽车与飞机出现，<b>垄断组织</b>迅速形成——自由资本主义，迈入帝国主义阶段。</p>
    `,
    button: '前往 1914 年的萨拉热窝 →',
    next: 'c9'
  },

  c9: {
    step: 9,
    era: '1914 年 6 月 28 日 · 萨拉热窝',
    chapter: '终章',
    title: '枪声响起',
    body: `
      <p>19 世纪末 20 世纪初，帝国主义各国<b>政治经济发展不平衡</b>：后起的德国工业实力猛增，却只分到很少的殖民地；老牌的英法则占据着大片原料产地与商品市场。</p>

      <p>1914 年 6 月 28 日，萨拉热窝的枪声响起。一个月内，欧洲主要国家相继卷入——<b>第一次世界大战爆发</b>。</p>
    `,
    button: '看看这条路通向哪里 →',
    next: 'eA'
  },

  /* ======= 挥霍线 ======= */

    step: 6,
    era: '18 世纪 · 你的城市',

    title: '挥霍一空',
    body: `

    step: 7,
    era: '若干年后 · 你的城市',

    title: '迟来的醒悟',
    body: `
      <p>你卖掉了宫殿，遣散了仆人，把最后一笔钱换成新机器，重新开工。</p>

      <p>后来的人写道：资本最怕的不是亏损，而是<b>停顿</b>。原始积累如果没能变成持续的再生产，就只是一场昂贵的烟花。</p>

  /* ================= 结局 ================= */
  eA: {
    type: 'ending',
    era: '1914 · 终点，也是起点',
    chapter: '结局一',
    title: '你走的是历史真实走过的那条路',
    body: () => {
      const strong = state.inst >= 2;
      return `
        <p>从佛罗伦萨的手工工场到萨拉热窝的枪声，这条路的起点，就是账房里的那个决定：<b>把积累的资本继续投入生产，而不是挥霍掉。</b></p>

        ${strong

          : '<p>但你的制度没跟上。工厂冒烟、城市膨胀，工人却挤在贫民窟里。社会矛盾像蒸汽一样在锅炉里积压——这也是一战前欧洲的真实底色。</p>'}
        <p>而巨人之间必然相撞。发展不平衡的列强，最终把整个世界拖进了 1914 年。</p>
        <p class="hl">萨拉热窝的枪声不是意外，它是从佛罗伦萨开始的这条因果链的终点。</p>
      `;
    }
  },

  eB1: {
    type: 'ending',
    era: '另一条时间线 · 你的城市',
    chapter: '结局二',
    title: '迟到的醒悟',
    body: () => `
      <p>你的城市终究没能等来自己的工业革命。多年以后，它成了别国工业品的倾销市场，也成了廉价原料的产地。</p>
      <p>但在图书馆里，还留着你当年资助过的画作、书籍与手稿。人们记得这里的艺术，却记不起这里的工厂。</p>
      <p>历史学家说：资本如果只被消费，它只是一次性的财富；只有被不断投入再生产，它才会长成工业文明。</p>
      <p class="hl">挥霍掉的是钱，错过的是一个时代。</p>
    `
  },

  eB2: {
    type: 'ending',
    era: '另一条时间线 · 你的城市',
    chapter: '结局二',
    title: '什么都没留下',
    body: () => `
      <p>你继续挥霍。当最后一只金盘子被当掉时，你才发现：手工工场早已荒废，账本上只剩欠款。</p>
      <p>没有工厂，没有铁路，没有银行，也没有能撑起一座城市的产业。你的城市安静了下来，像什么都没发生过。</p>
      <p>而在海峡对岸，蒸汽机的轰鸣声一年比一年更响。</p>
      <p class="hl">同样的一笔原始积累，一边变成了蒸汽机，一边变成了金餐具。</p>
    `
  }
};

/* ================= 渲染 ================= */
const stage = document.getElementById('stage');
const bar = document.getElementById('bar');

function updateHUD(){
  ['cap','idea','inst'].forEach(k=>{
    const stat = document.querySelector(`.stat[data-key="${k}"]`);
    stat.querySelector('.val').textContent = state[k];
    stat.classList.remove('pop');
    void stat.offsetWidth;
    stat.classList.add('pop');
  });
}

function updateBar(step){
  const p = Math.min(step, TOTAL_STEPS) / TOTAL_STEPS * 100;
  bar.style.width = p + '%';
}

function render(id){
  currentId = id;
  const s = scenes[id];

  if(s.type === 'ending'){ renderEnding(s); return; }

  const body = typeof s.body === 'function' ? s.body() : s.body;

  let actionsHTML;
  if(s.choices){
    actionsHTML = s.choices.map((c,i)=>`
      <button class="choice" data-i="${i}">
        <span class="idx">${'ABCD'[i]}</span>
        <span class="txt">${c.label}</span>
      </button>`).join('');
  } else {
    actionsHTML = `
      <button class="choice single" data-go="${s.next}">
        <span class="txt">${s.button || '继续 →'}</span>
      </button>`;
  }

  stage.innerHTML = `
    <section class="card">
      <div class="era">${s.era}</div>
      <h2>${s.chapter} · ${s.title}</h2>
      <div class="body">${body}</div>
      <div class="actions">${actionsHTML}</div>
    </section>`;

  updateBar(s.step);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderEnding(s){
  const body = typeof s.body === 'function' ? s.body() : s.body;

  stage.innerHTML = `
    <section class="card ending">
      <div class="era">${s.era}</div>
      <h2>${s.chapter} · ${s.title}</h2>
      <div class="body">${body}</div>

      <div class="final">
        <div class="final-title">你走完的这一局</div>
        <div class="final-stats">
          <div><span>💰 资本积累</span><b>${state.cap}</b></div>
          <div><span>💡 思想解放</span><b>${state.idea}</b></div>
          <div><span>🏛️ 制度建构</span><b>${state.inst}</b></div>
        </div>
      </div>

      <button class="restart" id="restart">↺ 换一条路，再走一遍</button>
    </section>`;

  updateBar(TOTAL_STEPS);
  document.getElementById('restart').addEventListener('click', restart);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ================= 交互 ================= */
function applyEff(eff){
  if(!eff) return;
  for(const [k,v] of Object.entries(eff)){
    state[k] = Math.max(0, state[k] + v);
  }
  updateHUD();
}

stage.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;

  if(btn.dataset.go){
    render(btn.dataset.go);
    return;
  }

  const idx = Number(btn.dataset.i);
  const choice = scenes[currentId].choices[idx];
  if(!choice) return;

  applyEff(choice.eff);
  render(choice.next);
});

function restart(){
  state.cap = 2;
  state.idea = 0;
  state.inst = 0;
  updateHUD();
  render('c1');
}

/* ================= 启动 ================= */
updateHUD();
render('c1');
</script>
</body>
</html>
